<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Form Task</title>
</head>
<body>      
    <section class="shape-panel">
        <h2>Shape's Controls</h2>
        <div class="form-elements">
            <label for="scaleSlider">Scale</label>
            <input type="range" id="scaleSlider" min="1" max="3" step="0.1" value="1">
      
            <label for="rotateSlider">Rotate</label>
            <input type="range" id="rotateSlider" min="0" max="360" step="1" value="0">
      
            <label for="colorPicker">Colour</label>
            <input type="color" id="colorPicker" value="#ff0000">
      
            <button id="animateBtn">See the Shape Grow!</button>
        </div>
        <div class="shape"></div>
        </section>
      
    <section class="paint-canvas">
        <h2>Canvas</h2>
        <div class="form-elements">
            <label for="paintColor">Brush Color</label>
            <input type="color" id="paintColor" value="#000000">
      
            <label for="brushSize">Brush Size</label>
            <input type="range" id="brushSize" min="1" max="30" value="5">
      
            <label for="opacitySlider">Opacity</label>
            <input type="range" id="opacitySlider" min="0" max="1" step="0.01" value="1">
      
            <button id="clearCanvas">Clear Canvas</button>
        </div>
        <canvas id="paintCanvas"></canvas>
        </section>
      </div>
      
    <script src="script.js"></script>
</body>
</html>
