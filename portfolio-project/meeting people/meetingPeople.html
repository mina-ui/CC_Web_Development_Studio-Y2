<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="meetingPeople.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>So Nice to Meet You!</title>
    <link rel="icon" href="../images/kittymail100.gif" type="image/gif" />
  </head>
  <body>
    <div id="container">
      <header>
        <a href="#" id="cvLink" class="nav-link">cv</a>
        <a href="../index.html" class="nav-link">home</a>
      </header>

      <div id="cvModal" class="modal">
        <div class="modal-content">
          <span class="close" id="cvClose">&times;</span>
          <p>this is the cv</p>
        </div>
      </div>
      <div id="overlay"></div>

      <main>
        <!-- how do i make this work safely/minimise spam if possible -->
        <!-- don't know how to do backend for the form -->
        <section class="formcarry-container">
          <form
            action="form-process.php"
            method="POST"
            enctype="multipart/form-data"
          >
            <div class="formcarry-block">
              <label for="fc-generated-1-name">Full Name</label>
              <input
                type="text"
                name="name"
                id="fc-generated-1-name"
                placeholder="Your first and last name"
              />
            </div>

            <div class="formcarry-block">
              <label for="fc-generated-1-email">Your Email Address</label>
              <input
                type="email"
                name="email"
                id="fc-generated-1-email"
                placeholder="john@doe.com"
              />
            </div>

            <div class="formcarry-block">
              <label for="fc-generated-1-message">Your message</label>
              <textarea
                name="message"
                name="message"
                id="fc-generated-1-message"
                placeholder="Enter your message..."
              ></textarea>
            </div>

            <div class="formcarry-block">
              <button type="submit">Send</button>
            </div>
          </form>
        </section>

        <section class="socialMedia">
          <a href="https://www.instagram.com/blue_spaces_/" target="_blank"
            ><i class="fab fa-instagram"></i
          ></a>

          <a
            href="https://www.linkedin.com/in/mina-vijayshankar-580082252/"
            target="_blank"
            ><i class="fab fa-linkedin-in"></i
          ></a>
        </section>
      </main>

      <footer></footer>
    </div>

    <script src="meetingPeople.js"></script>
  </body>
</html>
