<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Weather and Time Toggle</title>
</head>
<body>
  <div class="container">
    <!-- Toggle Button -->
    <label for="mode-toggle">Switch Mode: </label>
    <input type="checkbox" id="mode-toggle">
    <span id="mode-label">Weather Mode</span>

    <!-- Display weather information -->
    <div>
      <img id="weather-icon" alt="Character image">
      <p id="temperature"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
